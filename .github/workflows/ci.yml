name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  data-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p data-code --no-run
      - run: cargo test -p datacode_abi --no-run

  ml-dylib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path datacode_lib/ML-Datacode-lib/Cargo.toml --features data-code-table
