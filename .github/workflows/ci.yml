name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  data-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - run: chmod +x scripts/init-submodules.sh && ./scripts/init-submodules.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p data-code --no-run
      - run: cargo test -p data-code