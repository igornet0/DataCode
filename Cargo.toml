[workspace]
members = [
    "datacode_sdk",
    "datacode_sdk/datacode_abi",
]
# Standalone cdylib crates built from integration tests via `cargo build --manifest-path ...`.
# Without exclude, Cargo errors: "current package believes it's in a workspace when it's not".
exclude = [
    "tests/test_lib/math_native",
    "tests/test_lib/ml_native",
]

[package]
name = "data-code"
version = "2.4.4"
edition = "2021"
description = "ДатаКод - Интерактивный язык программирования для быстрой обработки данных"
license = "MIT"
authors = ["Igor <igornet0@users.noreply.github.com>"]
repository = "https://github.com/igornet0/DataCode"
keywords = ["programming-language", "interpreter", "repl", "data-processing"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["threaded_dispatch"]
profile = []  # Счётчики: opcodes, store allocations, store get (вывод в конце run)
threaded_dispatch = []  # Hot-first opcode dispatch in executor (reordered match)
allocator_jemalloc = ["jemallocator"]
archive-rar = ["dep:unrar-ng"]
# Reserved for embedders that need the legacy global-merge API re-exported at crate boundary (see `legacy_merge` module).
legacy_vm_merge = []
metal = []
deferred_stack_gc = []

[lib]
name = "data_code"
path = "src/lib.rs"

[[bin]]
name = "datacode"
path = "src/main.rs"

[[bin]]
name = "dpm"
path = "src/dpm_main.rs"

[[bin]]
name = "datacode-server"
path = "src/datacode_server_main.rs"

[dependencies]
datacode_abi = { path = "datacode_sdk/datacode_abi" }

# Async runtime for WebSocket server
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Date/time utilities
chrono = "0.4.41"

# File format support
csv = "1.3.1"
calamine = "0.28.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
bincode = "1.3"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
rand = "0.8"
argon2 = "0.5"
bcrypt = "0.15"
password-hash = "0.5"
subtle = "2.5"

# WebSocket сервер для удаленного выполнения кода
tokio-tungstenite = "0.21"
tungstenite = "0.21"
base64 = "0.22"
crc32fast = "1.4"
flate2 = "1.0"
arrow = { version = "54", default-features = false, features = ["ipc"] }

# HTTP server (datacode-server)
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["client", "server", "http1", "tokio"] }
local-ip-address = "0.6"

# SQLite экспорт для модели данных
rusqlite = { version = "0.30", features = ["bundled"] }

# DataSource SQL / MongoDB drivers
postgres = "0.19"
bytes = "1"
mysql = "25"
tiberius = { version = "0.12", default-features = false, features = ["chrono", "tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
mongodb = { version = "3", default-features = true }
bson = "2"

# Plot module dependencies
winit = "0.29"
image = "0.24"
softbuffer = "0.4"
fontdue = "0.7"

# Regular expressions
regex = "1.10"

# UUID (v4, v5, v7, parse, namespaces)
uuid = { version = "1", features = ["v3", "v4", "v5", "v7"] }

# DPM: manifest and config
toml = "0.8"
serde_yaml = "0.9"
quick-xml = "0.37"
roxmltree = "0.20"
dirs = "5.0"
dialoguer = "0.11"

# Dynamic native module loading (.so / .dylib)
libloading = "0.8"

# Native module artifact (.dcmodule zip)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Archive API
memmap2 = "0.9"
lru = "0.12"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["compress", "util"] }
unrar-ng = { version = "0.7", optional = true }

# Registry index for `dpm add <name>` (same crate as DPM binary)
ureq = { version = "2", default-features = true, features = ["tls"] }

# Built-in `web` module: HTML parse + Chromium CDP automation
scraper = "0.20"
chromiumoxide = { version = "0.7", default-features = true, features = ["tokio-runtime"] }
futures = "0.3"

# Global allocator: reduces contention under multi-threaded load (--features allocator_jemalloc)
jemallocator = { version = "0.5", optional = true }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
hostname = { version = "0.4.2", default-features = false }
if-addrs = { version = "0.15.0", default-features = false }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["compress", "util"] }

[lints]
workspace = true

# Единая политика clippy для workspace (наследуется пакетами с [lints] workspace = true).
[workspace.lints.clippy]
# Литералы вроде 3.14 в тестах и примерах не являются «приближением к PI» намеренно.
approx_constant = "allow"
# Массовый стилистический шум в логах make check 
empty_line_after_doc_comments = "allow"
redundant_field_names = "allow"
# Частые линты по `cargo clippy -p data-code --lib` (счётчик по #lint в help URL).
needless_borrow = "allow"
needless_return = "allow"
explicit_auto_deref = "allow"
manual_strip = "allow"
missing_const_for_thread_local = "allow"
ptr_arg = "allow"
map_clone = "allow"
redundant_closure = "allow"
useless_asref = "allow"
# Топ по chek_2.log / повторный замер после --fix (стиль, без списка файлов).
collapsible_match = "allow"
collapsible_if = "allow"
new_without_default = "allow"
mutable_key_type = "allow"
get_first = "allow"
# Топ по chek_3.log (повторный замер после --fix).
manual_range_contains = "allow"
identity_op = "allow"
needless_range_loop = "allow"
len_zero = "allow"
option_as_ref_deref = "allow"
# Топ по chek_4.log (повторный замер).
unwrap_or_default = "allow"
unused_enumerate_index = "allow"
unnecessary_map_or = "allow"
manual_clamp = "allow"
useless_format = "allow"
manual_checked_ops = "allow"
# chek_6.log / повторный замер после --fix и точечных правок.
module_inception = "allow"
arc_with_non_send_sync = "allow"
only_used_in_recursion = "allow"
wrong_self_convention = "allow"
inherent_to_string = "allow"
while_let_loop = "allow"
nonminimal_bool = "allow"
match_like_matches_macro = "allow"