[workspace]
members = [
    "datacode_sdk",
    "datacode_sdk/datacode_abi",
]
# Standalone cdylib crates built from integration tests via `cargo build --manifest-path ...`.
# Without exclude, Cargo errors: "current package believes it's in a workspace when it's not".
exclude = [
    "tests/test_lib/math_native",
    "tests/test_lib/ml_native",
]

[package]
name = "data-code"
version = "2.3.4"
edition = "2021"
description = "ДатаКод - Интерактивный язык программирования для быстрой обработки данных"
license = "MIT"
authors = ["Igor <igornet0@users.noreply.github.com>"]
repository = "https://github.com/igornet0/DataCode"
keywords = ["programming-language", "interpreter", "repl", "data-processing"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
profile = []  # Счётчики: opcodes, store allocations, store get (вывод в конце run)
allocator_jemalloc = ["jemallocator"]

[lib]
name = "data_code"
path = "src/lib.rs"

[[bin]]
name = "datacode"
path = "src/main.rs"

[[bin]]
name = "dpm"
path = "src/dpm_main.rs"

[[bin]]
name = "datacode-server"
path = "src/datacode_server_main.rs"

[dependencies]
datacode_abi = { path = "datacode_sdk/datacode_abi" }

# Async runtime for WebSocket server
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Date/time utilities
chrono = "0.4.41"

# File format support
csv = "1.3.1"
calamine = "0.28.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"

# WebSocket сервер для удаленного выполнения кода
tokio-tungstenite = "0.21"
tungstenite = "0.21"
base64 = "0.22"

# HTTP server (datacode-server)
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["client", "server", "http1", "tokio"] }
local-ip-address = "0.6"

# SQLite экспорт для модели данных
rusqlite = { version = "0.30", features = ["bundled"] }

# Plot module dependencies
winit = "0.29"
image = "0.24"
softbuffer = "0.4"
fontdue = "0.7"

# Regular expressions
regex = "1.10"

# UUID (v4, v5, v7, parse, namespaces)
uuid = { version = "1", features = ["v3", "v4", "v5", "v7"] }

# DPM: manifest and config
toml = "0.8"
dirs = "5.0"
dialoguer = "0.11"

# Dynamic native module loading (.so / .dylib)
libloading = "0.8"

# Native module artifact (.dcmodule zip)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Registry index for `dpm add <name>` (same crate as DPM binary)
ureq = { version = "2", default-features = true, features = ["tls"] }

# Global allocator: reduces contention under multi-threaded load (--features allocator_jemalloc)
jemallocator = { version = "0.5", optional = true }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
hostname = { version = "0.4.2", default-features = false }
if-addrs = { version = "0.15.0", default-features = false }

[dev-dependencies]
tempfile = "3"
